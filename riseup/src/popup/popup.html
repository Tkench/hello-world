<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RiseUp</title>
<link rel="stylesheet" href="../tools/ui.css">
<style>
  body { width: 290px; padding: 16px; margin: 0; }
  h1 { font-size: 16px; margin: 0; }
  .stack { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  p { margin: 0; }
  .btn { width: 100%; }
  .link { border: 0; background: none; padding: 0; color: var(--muted); font: inherit; font-size: 12px; text-decoration: underline; cursor: pointer; align-self: flex-start; }
</style>
</head>
<body>
  <div class="brandbar"><span class="mark"><svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 9.5 8 5l4.5 4.5"/><path d="M5 13h6"/></svg></span><h1>RiseUp</h1></div>
  <div class="stack">
    <label class="check"><input type="checkbox" id="enabled"> Apply RiseUp in Rise</label>
    <label class="check"><input type="checkbox" id="launcher"> Show the RiseUp button</label>
    <p class="hint" id="where"></p>
    <button class="btn primary" id="tools" type="button">Publish &amp; tools</button>
    <button class="link" id="reset" type="button">Move the RiseUp button back to the corner</button>
  </div>
<script src="popup.js"></script>
</body>
</html>
